name: deploy
on:
  push:
    branches: [main]
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.repository }}-training
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/reusable-verify.yml
    permissions:
      contents: read

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: training
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.TRAINING_PROJECT_ID }}
      APPROVED_PROJECT_ID: ${{ vars.APPROVED_TRAINING_PROJECT_ID }}
      REGION: asia-northeast1
      REPOSITORY: training
      SERVICE: training-chat
      BUILD_SERVICE_ACCOUNT: ${{ vars.BUILD_SERVICE_ACCOUNT }}
      RUNTIME_SERVICE_ACCOUNT: ${{ vars.RUNTIME_SERVICE_ACCOUNT }}
      FIREBASE_API_KEY: ${{ vars.TRAINING_FIREBASE_API_KEY }}
      FIREBASE_AUTH_DOMAIN: ${{ vars.TRAINING_FIREBASE_AUTH_DOMAIN }}
      FIREBASE_STORAGE_BUCKET: ${{ vars.TRAINING_FIREBASE_STORAGE_BUCKET }}
      FIREBASE_APP_ID: ${{ vars.TRAINING_FIREBASE_APP_ID }}
      RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ vars.TRAINING_RECAPTCHA_ENTERPRISE_SITE_KEY }}

    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.TRAINING_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3

      - id: image
        name: Build commit-scoped image
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${PROJECT_ID}" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]; then
            echo "Invalid Google Cloud project ID" >&2
            exit 1
          fi
          required=(
            APPROVED_PROJECT_ID BUILD_SERVICE_ACCOUNT RUNTIME_SERVICE_ACCOUNT FIREBASE_API_KEY
            FIREBASE_AUTH_DOMAIN FIREBASE_STORAGE_BUCKET FIREBASE_APP_ID
            RECAPTCHA_ENTERPRISE_SITE_KEY
          )
          for name in "${required[@]}"; do
            value="${!name}"
            if [[ -z "${value}" || "${value}" == "." || "${value}" == $'\n' ]]; then
              echo "Missing or invalid GitHub variable: ${name}" >&2
              exit 1
            fi
          done
          if [[ ! "${APPROVED_PROJECT_ID}" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ || "${PROJECT_ID}" != "${APPROVED_PROJECT_ID}" ]]; then
            echo "Project ID is not the independently approved training project" >&2
            exit 1
          fi
          if [[ ! "${BUILD_SERVICE_ACCOUNT}" =~ ^projects/${PROJECT_ID}/serviceAccounts/[a-z0-9-]+@${PROJECT_ID}\.iam\.gserviceaccount\.com$ ]]; then
            echo "BUILD SERVICE ACCOUNT must be a full resource name in the training project" >&2
            exit 1
          fi
          if [[ ! "${RUNTIME_SERVICE_ACCOUNT}" =~ ^[a-z0-9-]+@${PROJECT_ID}\.iam\.gserviceaccount\.com$ ]]; then
            echo "RUNTIME SERVICE ACCOUNT must be an email in the training project" >&2
            exit 1
          fi
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          SUBSTITUTIONS="_IMAGE=${IMAGE},_NEXT_PUBLIC_APP_ENV=training,_NEXT_PUBLIC_EXPECTED_FIREBASE_PROJECT_ID=${APPROVED_PROJECT_ID},_NEXT_PUBLIC_FIREBASE_PROJECT_ID=${PROJECT_ID},_NEXT_PUBLIC_FIREBASE_API_KEY=${FIREBASE_API_KEY},_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${FIREBASE_AUTH_DOMAIN},_NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${FIREBASE_STORAGE_BUCKET},_NEXT_PUBLIC_FIREBASE_APP_ID=${FIREBASE_APP_ID},_NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY=${RECAPTCHA_ENTERPRISE_SITE_KEY}"
          gcloud builds submit \
            --project "${PROJECT_ID}" \
            --service-account "${BUILD_SERVICE_ACCOUNT}" \
            --config cloudbuild.yaml \
            --substitutions "${SUBSTITUTIONS}"
          echo "name=${IMAGE}" >> "${GITHUB_OUTPUT}"

      - id: deploy-auth
        name: Refresh Google Cloud credentials after the build
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.TRAINING_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

      - id: candidate
        name: Deploy uniquely tagged candidate without traffic
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_TAG="candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          REVISION="$(gcloud run deploy "${SERVICE}" \
            --project "${PROJECT_ID}" \
            --image "${{ steps.image.outputs.name }}" \
            --region "${REGION}" \
            --service-account "${RUNTIME_SERVICE_ACCOUNT}" \
            --no-allow-unauthenticated \
            --no-traffic \
            --tag "${CANDIDATE_TAG}" \
            --update-env-vars "GIT_SHA=${GITHUB_SHA},TRAINING_PROJECT_ID=${PROJECT_ID},ALLOWED_TRAINING_PROJECT_IDS=${APPROVED_PROJECT_ID}" \
            --format='value(status.latestCreatedRevisionName)')"
          test -n "${REVISION}"
          echo "revision=${REVISION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${CANDIDATE_TAG}" >> "${GITHUB_OUTPUT}"

      - id: urls
        name: Resolve service and candidate URLs
        shell: bash
        env:
          CANDIDATE_TAG: ${{ steps.candidate.outputs.tag }}
          DEPLOYED_REVISION: ${{ steps.candidate.outputs.revision }}
        run: |
          set -euo pipefail
          SERVICE_JSON="$(gcloud run services describe "${SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format=json)"
          BASE_URL="$(jq -er '.status.url | select(type == "string" and length > 0)' <<< "${SERVICE_JSON}")"
          CANDIDATE_RECORD="$(jq -er --arg tag "${CANDIDATE_TAG}" '
            [.status.traffic[]? | select(.tag == $tag)] as $matches
            | if ($matches | length) == 1
                and ($matches[0].url | type) == "string"
                and ($matches[0].url | length) > 0
                and ($matches[0].revisionName | type) == "string"
                and ($matches[0].revisionName | length) > 0
              then [$matches[0].url, $matches[0].revisionName] | @tsv
              else error("candidate tag must resolve to exactly one URL and revision")
              end
          ' <<< "${SERVICE_JSON}")"
          IFS=$'\t' read -r CANDIDATE_URL TAGGED_REVISION <<< "${CANDIDATE_RECORD}"
          test "${TAGGED_REVISION}" = "${DEPLOYED_REVISION}"
          echo "base_url=${BASE_URL}" >> "${GITHUB_OUTPUT}"
          echo "candidate_url=${CANDIDATE_URL}" >> "${GITHUB_OUTPUT}"

      - id: smoke-auth
        name: Mint ID token for the Cloud Run service audience
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.TRAINING_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.urls.outputs.base_url }}
          id_token_include_email: true

      - name: Authenticated smoke test
        shell: bash
        env:
          CANDIDATE_URL: ${{ steps.urls.outputs.candidate_url }}
          ID_TOKEN: ${{ steps.smoke-auth.outputs.id_token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            "${CANDIDATE_URL}/api/health"

      - name: Promote verified candidate
        shell: bash
        env:
          CANDIDATE_TAG: ${{ steps.candidate.outputs.tag }}
          DEPLOYED_REVISION: ${{ steps.candidate.outputs.revision }}
        run: |
          set -euo pipefail
          gcloud run services update-traffic "${SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --to-revisions "${DEPLOYED_REVISION}=100"
          gcloud run services update-traffic "${SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --remove-tags "${CANDIDATE_TAG}"
