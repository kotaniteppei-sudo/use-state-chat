name: reusable-verify
on:
  workflow_call:
permissions:
  contents: read
env:
  NEXT_PUBLIC_APP_NAME: Training Chat CI
  NEXT_PUBLIC_USE_FIREBASE_EMULATORS: "true"
  NEXT_PUBLIC_APP_ENV: training
  NEXT_PUBLIC_EXPECTED_FIREBASE_PROJECT_ID: demo-training-chat
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-training-chat
  NEXT_PUBLIC_FIREBASE_API_KEY: demo-api-key
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-training-chat.firebaseapp.com
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-training-chat.firebasestorage.app
  NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:demo
  TRAINING_PROJECT_ID: demo-training-chat
  ALLOWED_TRAINING_PROJECT_IDS: demo-training-chat
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:emulators
      - run: npm run build
